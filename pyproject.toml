[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enrich-gallery3-photo-exif"
version = "0.0.1"
description = "Interactive utility for enriching EXIF metadata of photos stored in a Gallery3 installation."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
keywords = ["gallery3", "exif"]
authors = [
    { name = "Gene Wood", email = "gene_wood@public.cementhorizon.com" },
]
maintainers = [
    { name = "Gene Wood", email = "gene_wood@public.cementhorizon.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "click",
    "mariadb",
    "platformdirs",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pillow",
    "pytest",
    "ruff",
]

[project.scripts]
enrich-gallery3-photo-exif = "enrich_gallery3_photo_exif:main"

[project.urls]
Homepage = "https://github.com/gene1wood/enrich-gallery3-photo-exif"
Repository = "https://github.com/gene1wood/enrich-gallery3-photo-exif"
Changelog = "https://github.com/gene1wood/enrich-gallery3-photo-exif/blob/main/CHANGELOG.md"
Documentation = "https://github.com/gene1wood/enrich-gallery3-photo-exif#readme"
Issues = "https://github.com/gene1wood/enrich-gallery3-photo-exif/issues"
Funding = "https://github.com/sponsors/gene1wood"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--capture=no"
testpaths = ["tests"]
